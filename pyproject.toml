[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "technitium-tui"
version = "0.1.0"
description = "A full-featured, keyboard-first (HJKL) terminal UI for Technitium DNS Server"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "textual>=1.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
tnt-tui = "technitium_tui.app:run"

[tool.hatch.build.targets.wheel]
packages = ["src/technitium_tui"]
